<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web concept generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&family=Figtree:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;700&family=Source+Serif+4:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="meerkat/tokens.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app" id="app" data-phase="idle">

    <!-- Search -->
    <header class="search">
      <div class="field" id="field">
        <i data-lucide="globe" class="field-ico" aria-hidden="true"></i>
        <input id="domain" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="history" aria-autocomplete="list"
               aria-label="Website address" placeholder="Enter a website, like example.com">
        <button class="go" id="go" type="submit" aria-label="Generate concepts" hidden><i data-lucide="arrow-right"></i></button>
      </div>
      <div class="popover" id="pop" hidden>
        <ul id="history" role="listbox" aria-label="Recent sites"></ul>
        <ol id="steps" class="steps" aria-live="polite" hidden></ol>
        <p id="hint" class="pop-hint" hidden></p>
      </div>
    </header>

    <!-- Concept board -->
    <section class="board-wrap" aria-label="Concept board">
      <div class="board is-skeleton" id="board">
        <article class="concept main" data-page="home"><span class="cap">Homepage</span><div class="page-slot"></div></article>
        <article class="concept side" data-page="services"><span class="cap">Landing page</span><div class="page-slot"></div></article>
        <article class="concept side" data-page="details"><span class="cap">Details page</span><div class="page-slot"></div></article>
      </div>
      <div class="popover pop-board" id="pop-style" hidden>
        <ol id="steps-style" class="steps" aria-live="polite"></ol>
      </div>
    </section>

    <!-- Style select + dropzone -->
    <section class="styles" id="dz" aria-label="Styles">
      <button class="dz-hint" id="dz-hint" type="button">
        <i data-lucide="image-up" aria-hidden="true"></i>
        <span>Drop an image to extract a style</span>
      </button>
      <div class="strip" id="strip" role="radiogroup" aria-label="Style"></div>
      <input type="file" id="file" accept="image/*" hidden>
    </section>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
